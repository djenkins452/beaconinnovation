<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install AIMS Field</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b1622;
            color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 420px;
        }
        h1 {
            font-size: 1.9rem;
            margin-bottom: 8px;
        }
        .version {
            color: #8fa3b8;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }
        .install-btn {
            display: block;
            width: 100%;
            padding: 22px 24px;
            font-size: 1.35rem;
            font-weight: 600;
            color: #fff;
            background: #0a84ff;
            border: none;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.35);
            -webkit-tap-highlight-color: transparent;
        }
        .install-btn:active {
            background: #0060df;
        }
        .note {
            margin-top: 32px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #8fa3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>AIMS Field</h1>
        <p class="version">Version 0.2.0</p>

        <a class="install-btn"
           href="itms-services://?action=download-manifest&amp;url=https://beacon-innovation.com/static/downloads/manifest.plist">
            Install AIMS Field
        </a>

        <p class="note">
            Open this page in Safari on your iPhone, then tap the button above.
            When prompted, tap <strong>Install</strong>. After installation, go to
            <strong>Settings &rarr; General &rarr; VPN &amp; Device Management</strong>
            and trust the developer to launch the app.
        </p>
    </div>
</body>
</html>
