name: CI

# Runs the Django test suite against PostgreSQL (the only supported backend).
# There is deliberately no SQLite path here — tests must run on Postgres.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Isolated CI databases on the service container above.
      DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon
      PLATFORM_DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon_platform
      DJANGO_SECRET_KEY: ci-secret-not-used-in-production
      DJANGO_DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create separate platform database
        run: PGPASSWORD=beacon psql -h localhost -U beacon -d beacon -c "CREATE DATABASE beacon_platform;"

      - name: Django system checks
        run: python manage.py check

      - name: Migrate (default + platform)
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --database=platform --noinput

      - name: Run test suite (PostgreSQL, isolated test databases)
        run: python manage.py test -v 1
