{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon Downloads - Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #212529 0%, #343a40 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .login-container {
            background: #fff; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,.25); width: 100%; max-width: 400px;
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { color: #212529; font-size: 26px; margin-bottom: 8px; }
        .login-header p { color: #718096; font-size: 14px; }
        .error-message {
            background: #fed7d7; color: #c53030; padding: 12px 16px;
            border-radius: 8px; margin-bottom: 20px; font-size: 14px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #2d3748; font-weight: 500; margin-bottom: 8px; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0;
            border-radius: 8px; font-size: 16px; transition: border-color .2s;
        }
        .form-group input:focus { outline: none; border-color: #f4623a; }
        .submit-btn {
            width: 100%; padding: 14px; background: #f4623a; color: #fff; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background .2s;
        }
        .submit-btn:hover { background: #d9502b; }
        .footer-text { text-align: center; margin-top: 24px; color: #a0aec0; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Beacon Downloads</h1>
            <p>Sign in to access your products</p>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <p class="footer-text">Beacon Innovation LLC</p>
    </div>
</body>
</html>
