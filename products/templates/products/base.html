{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{% block title %}Beacon Downloads{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.ico' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,700" rel="stylesheet" />
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; }
        .portal-nav { background-color: #212529; }
        .portal-nav .navbar-brand,
        .portal-nav .nav-link { color: #fff; }
        .portal-nav .nav-link:hover { color: #f4623a; }
        .portal-main { max-width: 960px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
        .product-card { transition: box-shadow .15s ease, transform .15s ease; }
        .product-card:hover { box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.12); transform: translateY(-2px); }
        .product-icon {
            width: 56px; height: 56px; border-radius: 12px; object-fit: cover;
            background: #f4623a1a; display: flex; align-items: center; justify-content: center;
            color: #f4623a; font-size: 1.6rem; flex: 0 0 auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg portal-nav py-3">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand fw-bold" href="{% url 'products:my_products' %}">Beacon Downloads</a>
            {% if user.is_authenticated %}
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-white-50 small d-none d-sm-inline">
                    {{ user.get_full_name|default:user.get_username }}
                </span>
                <a class="nav-link p-0 small" href="{% url 'products:password_change' %}">Change password</a>
                {% if user.is_staff %}
                <a class="nav-link p-0 small" href="/admin/">Admin</a>
                {% endif %}
                <a class="btn btn-sm btn-outline-light" href="{% url 'products:logout' %}">Log out</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="portal-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
